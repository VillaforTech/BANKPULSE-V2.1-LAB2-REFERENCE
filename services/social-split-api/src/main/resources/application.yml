server:
  port: 8086
spring:
  application:
    name: social-split-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankpulse_domains?currentSchema=social_split}
    username: ${SPRING_DATASOURCE_USERNAME:split_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:split_local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
