name: BankPulse Reference CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_BAKE: "false"
  COMPOSE_PARALLEL_LIMIT: "2"
  BANKPULSE_URL: http://localhost:18080
  GRAFANA_URL: http://localhost:13000

jobs:
  architecture-contract:
    name: Architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate architecture decisions and tooling
        run: |
          ./scripts/adr --version
          ./scripts/adr list
          python3 scripts/check_adrs.py
          python3 -m unittest discover -s tests/adr -v
      - name: Validate existing platform assets and reference deliverables
        run: |
          set -euo pipefail
          for service in payments-api audit-api experiences-api travel-benefits-api events-api social-split-api; do
            test -f "services/$service/Dockerfile"
            test -f "services/$service/pom.xml"
            test -f "services/$service/src/main/resources/application.yml"
          done
          for file in observability/compose.yaml observability/prometheus.yml \
            observability/grafana/dashboards/bankpulse-overview.json \
            observability/grafana/dashboards/bankpulse-business.json \
            docs/architecture/DATA-OWNERSHIP.md docs/deber-01.md docs/kpis-deber-01.md \
            frontend/index.html frontend/app.js frontend/styles.css \
            scripts/unit-test.sh scripts/business_test.py scripts/projection-test.sh scripts/resilience_test.py scripts/browser-test.mjs; do
            test -s "$file"
          done
          docker compose config --quiet
          docker compose -f observability/compose.yaml config --quiet

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record tested commit
        run: |
          mkdir -p artifacts/unit
          git rev-parse HEAD > artifacts/unit/commit.txt
      - name: Build analytics test runtime
        run: docker compose build business-analytics
      - name: Execute domain and analytics unit tests
        run: |
          set -o pipefail
          bash scripts/unit-test.sh 2>&1 | tee artifacts/unit/tests.log
      - name: Require actual Java test execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('services').glob('*/target/surefire-reports/TEST-*.xml'))
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print(totals)
          assert totals['tests'] > totals['skipped'], 'No executed Java tests'
          assert totals['failures'] == totals['errors'] == 0, 'Failed Java tests'
          PY
      - name: Preserve unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankpulse-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/unit/
            services/*/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

  business-lab:
    name: Build, integration, business and observability
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Deliberately independent of unit-tests: keep the unit failure AND observe
    # the same faulty commit with healthy infrastructure and a failing business test.
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Record clean-run provenance
        run: |
          mkdir -p artifacts/ci
          python3 - <<'PY'
          import json, os, platform, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          data = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'startedAt': datetime.now(timezone.utc).isoformat(),
              'platform': platform.platform(),
          }
          Path('artifacts/ci/provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Build platform containers
        id: build
        run: docker compose build
      - name: Deploy and require every service readiness check
        id: deploy
        run: docker compose up -d --wait --wait-timeout 300
      - name: Start and verify Prometheus and Grafana
        id: observability
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          docker compose -f observability/compose.yaml up -d prometheus grafana
          python3 - <<'PY'
          import json, time, urllib.request
          checks = {
              'http://localhost:19090/-/healthy': None,
              'http://localhost:19090/-/ready': None,
              'http://localhost:13000/api/health': lambda data: data.get('database') == 'ok',
              'http://localhost:13000/api/dashboards/uid/bankpulse-business': lambda data: data['dashboard']['uid'] == 'bankpulse-business',
          }
          for url, validate in checks.items():
              deadline = time.monotonic() + 60
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          body = response.read()
                          assert response.status == 200
                          assert validate is None or validate(json.loads(body))
                      print('READY', url)
                      break
                  except Exception:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(1)
          PY
      - name: Validate interactive edge UI
        id: edge
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          curl -fsS "$BANKPULSE_URL/" | grep -q "BANKdragon"
          curl -fsS "$BANKPULSE_URL/app.js" | grep -q "Seat HOLD created"
      - name: Preserve existing platform and payment regression smoke
        id: smoke
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          set -o pipefail
          bash scripts/smoke-v2.sh 2>&1 | tee artifacts/ci/smoke.log
      - name: Verify projection transactions in an isolated PostgreSQL schema
        id: projection
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          set -o pipefail
          bash scripts/projection-test.sh 2>&1 | tee artifacts/ci/projection-tests.log
      - name: Test business promises with independent persisted observations
        id: business
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          EVIDENCE_DIR: artifacts/business
        run: bash scripts/business-test.sh
      - name: Install browser test runtime
        id: browser-setup
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.observability.outcome == 'success' }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify actual Grafana Live render, loss and reconnection
        id: browser
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' && steps.observability.outcome == 'success' }}
        env:
          EVIDENCE_DIR: artifacts/browser
          LATENCY_SAMPLES: "100"
        run: npm run browser-test
      - name: Verify replay, outages, restart and timers without traffic
        id: resilience
        if: ${{ !cancelled() && steps.business.outcome == 'success' && steps.browser.outcome == 'success' }}
        env:
          EVIDENCE_DIR: artifacts/resilience
        run: python3 scripts/resilience_test.py
      - name: Reject failed, skipped or incomplete acceptance evidence
        if: ${{ !cancelled() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          steps = json.loads(os.environ['STEP_RESULTS'])
          required = ('build', 'deploy', 'observability', 'edge', 'smoke', 'projection', 'business', 'browser-setup', 'browser', 'resilience')
          outcomes = {key: steps.get(key, {}).get('outcome', 'missing') for key in required}
          Path('artifacts/ci/stage-results.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          assert all(value == 'success' for value in outcomes.values()), outcomes
          business = json.loads(Path('artifacts/business/result.json').read_text())
          assert business['passed'] is True and business['checks'], 'Missing business evidence'
          assert all(check['passed'] is True for check in business['checks'])
          latency = json.loads(Path('artifacts/browser/latency.json').read_text())
          assert latency['requested'] >= 100
          assert latency['sent'] == latency['observed'] == latency['requested']
          assert latency['lost'] == latency['errors'] == 0 and not latency['pageErrors']
          assert math.isfinite(latency['p95']) and latency['p95'] <= 1000
          for name in ('grafana-live.png', 'grafana-disconnected.png', 'grafana-reconnected.png'):
              assert Path('artifacts/browser', name).stat().st_size > 0
          resilience = json.loads(Path('artifacts/resilience/result.json').read_text())
          assert resilience['passed'] is True and resilience['checks'], 'Missing recovery evidence'
          assert all(check['passed'] is True for check in resilience['checks'])
          PY
      - name: Capture diagnostics before teardown on success or failure
        if: always()
        run: |
          mkdir -p artifacts/ci
          python3 scripts/capture_business_state.py
          docker compose ps --all --format json > artifacts/ci/platform-status.json || true
          docker compose logs --no-color --tail=300 > artifacts/ci/platform.log 2>&1 || true
          docker compose -f observability/compose.yaml ps --all --format json > artifacts/ci/observability-status.json || true
          docker compose -f observability/compose.yaml logs --no-color --tail=200 > artifacts/ci/observability.log 2>&1 || true
          curl -fsS "$BANKPULSE_URL/api/business/snapshot" > artifacts/ci/final-snapshot.json || true
          for file in /tmp/bankpulse-payment.json /tmp/bankpulse-payment-retry.json; do
            if test -f "$file"; then cp "$file" artifacts/ci/; fi
          done
      - name: Preserve business, recovery and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankpulse-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Stop observability after evidence capture
        if: always()
        run: docker compose -f observability/compose.yaml down -v
      - name: Stop isolated reference platform
        if: always()
        run: docker compose down -v

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [architecture-contract, unit-tests, business-lab]
    if: ${{ always() }}
    steps:
      - name: Require every independent stage to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          status = {name: value['result'] for name, value in results.items()}
          print(json.dumps(status, indent=2))
          Path('release-gate.json').write_text(json.dumps(status, indent=2) + '\n')
          if set(status) != {'architecture-contract', 'unit-tests', 'business-lab'} or any(value != 'success' for value in status.values()):
              raise SystemExit('RELEASE BLOCKED: every required stage must succeed; failure, cancellation and skipped stages block.')
          print('PASS: business, infrastructure, recovery and render evidence passed.')
          PY
      - name: Preserve gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankpulse-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-gate.json
          if-no-files-found: error
          retention-days: 30
