name: bankpulse-reference-observability

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    networks:
      - observability
      - bankpulse

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bankpulse_demo
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: bankpulse-business-panel
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:13000/}"
      GF_LIVE_ALLOWED_ORIGINS: "${GRAFANA_LIVE_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000,http://localhost:18080,http://127.0.0.1:18080}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus
    networks:
      - observability
      - bankpulse

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-18088}:8080"
    networks:
      - observability

networks:
  observability:
    driver: bridge
  bankpulse:
    external: true
    name: bankpulse-reference-network

volumes:
  prometheus-data:
  grafana-data:
